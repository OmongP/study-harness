<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>읽어 온 기록 확인 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  button { font: inherit; color: #1C1B19; background: #FFFFFF; border: 1px solid #E6E2DA; cursor: pointer; }
  ul { list-style: none; }

  .caption { font-size: 13px; line-height: 1.5; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .title { font-size: 22px; font-weight: 700; line-height: 1.35; }
  .heading { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .body-muted { font-size: 16px; line-height: 1.6; color: #6B6760; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .back { display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 8px; font-size: 16px; font-weight: 600; }
  .topbar .caption { padding: 8px; }

  .content { display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 24px; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .source { align-self: flex-start; padding: 4px 12px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 999px; }

  .lines { display: flex; flex-direction: column; gap: 12px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  /* 인식된 한 줄 = 고를 수 있는 행. 선택은 색 + ✓ 문구로 함께 표시 */
  .line-item { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 44px; padding: 12px 16px; text-align: left; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 12px; }
  .line-item[aria-pressed="true"] { background: #E4EEEA; border: 1px solid #2F5D50; }
  .line-item .msg { font-size: 16px; line-height: 1.6; color: #1C1B19; }
  .line-item .state { color: #6B6760; }
  .line-item[aria-pressed="true"] .state { color: #2F5D50; font-weight: 700; }

  .bottom { position: sticky; bottom: 0; margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 20px; background: #FAF8F4; border-top: 1px solid #E6E2DA; }
  .btn-primary { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 20px; background: #2F5D50; color: #FFFFFF; border-radius: 12px; font-size: 16px; font-weight: 600; }
  .btn-secondary { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 16px; background: #FFFFFF; color: #1C1B19; border: 1px solid #E6E2DA; border-radius: 12px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main data-screen="capture-confirm" data-author="system" aria-label="읽어 온 기록 확인">

  <header class="topbar">
    <a class="back" href="start-sheet.html" data-ui-role="button" aria-label="기록 시작으로 돌아가기">‹ 뒤로</a>
    <p class="caption">10월 2일 금요일</p>
  </header>

  <div class="content">

    <div class="head">
      <p class="label source">대화 캡처에서 시작</p>
      <h1 class="title">읽어 온 대화 확인</h1>
      <p>캡처에서 읽은 대화예요. 영어로 다시 써 볼 말을 골라요.</p>
    </div>

    <section class="lines" aria-labelledby="lines-title">
      <h2 class="heading" id="lines-title">쓸 부분 고르기</h2>
      <ul class="list">
        <li>
          <button class="line-item" type="button" aria-pressed="true" data-ui-role="button">
            <span class="caption">지민</span>
            <span class="msg" data-author="user" data-original-id="k1">어제 회식 어땠어?</span>
            <span class="label state">✓ 고름</span>
          </button>
        </li>
        <li>
          <button class="line-item" type="button" aria-pressed="true" data-ui-role="button">
            <span class="caption">나</span>
            <span class="msg" data-author="user" data-original-id="k2">재밌었어. 팀 여행 얘기 많이 했어</span>
            <span class="label state">✓ 고름</span>
          </button>
        </li>
        <li>
          <button class="line-item" type="button" aria-pressed="true" data-ui-role="button">
            <span class="caption">지민</span>
            <span class="msg" data-author="user" data-original-id="k3">오 어디로 가?</span>
            <span class="label state">✓ 고름</span>
          </button>
        </li>
        <li>
          <button class="line-item" type="button" aria-pressed="true" data-ui-role="button">
            <span class="caption">나</span>
            <span class="msg" data-author="user" data-original-id="k4">제주도! 벌써 기대돼</span>
            <span class="label state">✓ 고름</span>
          </button>
        </li>
        <li>
          <button class="line-item" type="button" aria-pressed="false" data-ui-role="button">
            <span class="caption">지민</span>
            <span class="msg" data-author="user" data-original-id="k5">나중에 사진 보내줘</span>
            <span class="label state">고르지 않음</span>
          </button>
        </li>
      </ul>
      <p class="body-muted">손글씨 메모라면 말풍선 없이 글 한 편으로 이어 써도 돼요.</p>
    </section>

  </div>

  <footer class="bottom">
    <a class="btn-primary" href="write-conversation.html" data-ui-role="button">고른 말로 영어 쓰기</a>
    <a class="btn-secondary" href="write.html" data-ui-role="button">글 한 편으로 쓰기</a>
  </footer>

</main>
</body>
</html>
