<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교정 준비 중 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  img { display: block; }

  .heading { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .body-muted { font-size: 16px; line-height: 1.6; color: #6B6760; }

  /* 대기 상태: 두 줄 문구만. 캐릭터·진행률 바·퍼센트·저장 경고 없음 (RP-8, R5 피할 것) */
  .pending { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 20px; }
  .status { display: flex; flex-direction: column; gap: 4px; }
  .link { display: flex; align-items: center; align-self: flex-start; min-height: 44px; padding: 8px 0; font-size: 14px; font-weight: 600; line-height: 1.4; color: #2F5D50; text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<main data-screen="review-pending" data-author="system" aria-label="교정 준비 중">

  <section class="pending">
    <div class="status" role="status" aria-live="polite">
      <p class="heading">일기 저장 중</p>
      <p class="body-muted">교정을 준비하고 있어요</p>
    </div>
    <a class="link" href="review.html" data-ui-role="button">교정 보기로 넘어가기</a>
  </section>

</main>
</body>
</html>
