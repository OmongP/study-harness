<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write — Conversation — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  img { display: block; }

  .caption { font-size: 13px; line-height: 1.5; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .diary { font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 1.75; color: #1C1B19; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .back { display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 8px; font-size: 16px; font-weight: 600; }
  .topbar .caption { padding: 8px; }

  /* 맥락 띠: 누구와의 대화인지·캡처 날짜만 (RP-3) */
  .context { position: sticky; top: 0; z-index: 1; display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E6E2DA; border-radius: 0; }
  .context-title { font-size: 16px; font-weight: 600; }

  .write { display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 24px; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .source { padding: 4px 12px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 999px; }

  .bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; }
  .bubble-them { align-self: flex-start; background: #FFFFFF; border: 1px solid #E6E2DA; }
  .bubble-me { align-self: flex-end; background: #E4EEEA; }
  .turn { display: flex; flex-direction: column; gap: 8px; }

  .input-wrap { display: flex; flex-direction: column; gap: 8px; }
  .input { min-height: 88px; padding: 16px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 12px; outline: none; }
  .input.is-writing { border: 1px solid #2F5D50; }
  .count-row { display: flex; justify-content: flex-end; }

  .bottom { position: sticky; bottom: 0; margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 20px 20px; background: #FAF8F4; border-top: 1px solid #E6E2DA; }
  .btn-primary { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 20px; background: #2F5D50; color: #FFFFFF; border-radius: 12px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main data-screen="write-conversation" data-author="system" aria-label="대화 캡처로 쓰기">

  <!-- 자동 저장 상태 텍스트. '나가면 저장되지 않아요' 경고 없음 (RP-8) -->
  <header class="topbar">
    <a class="back" href="capture-confirm.html" data-ui-role="button" aria-label="읽어 온 내용 확인으로 돌아가기">‹ 확인</a>
    <p class="caption">10월 2일 금요일</p>
    <p class="caption" role="status" aria-live="polite">자동 저장됨 · 오후 8:40</p>
  </header>

  <div class="context" aria-label="대화 맥락">
    <p class="context-title">지수와의 대화</p>
    <p class="caption">10월 2일 카카오톡 캡처 · 내 말만 영어로 써요</p>
  </div>

  <!-- 작성 영역: 말풍선 원문은 그대로, 내 말마다 직접 쓰는 입력칸. AI 답변 도움·번역 채우기 버튼 없음 (R15 피할 것, PRD 6.5) -->
  <section class="write" data-area="write" aria-label="대화 속 내 말을 영어로 쓰기">
    <div class="meta-row">
      <p class="label source">대화 캡처에서 시작</p>
      <p class="caption">나만 보기 · 비공개 기록</p>
    </div>

    <p class="bubble bubble-them" data-author="user" aria-label="지수의 말">이번 주 금요일에 시간 돼?</p>

    <div class="turn">
      <p class="bubble bubble-me" data-author="user" aria-label="내 말">응, 저녁에는 괜찮아. 어디 가고 싶은 데 있어?</p>
      <div class="input-wrap">
        <p class="label" id="c1-label">이 말을 내 영어로</p>
        <div class="diary input is-writing" role="textbox" contenteditable="true" aria-multiline="true" aria-labelledby="c1-label" data-interactive="true" data-author="user" data-original-id="c1" lang="en">Yes, I'm okay at evening. Where do you want to go?</div>
        <div class="count-row">
          <p class="caption">50자</p>
        </div>
      </div>
    </div>

    <p class="bubble bubble-them" data-author="user" aria-label="지수의 말">새로 생긴 파스타집 가 보자!</p>

    <div class="turn">
      <p class="bubble bubble-me" data-author="user" aria-label="내 말">좋아. 일곱 시에 역 앞에서 만나자.</p>
      <div class="input-wrap">
        <p class="label" id="c2-label">이 말을 내 영어로</p>
        <div class="diary input" role="textbox" contenteditable="true" aria-multiline="true" aria-labelledby="c2-label" data-interactive="true" data-author="user" data-original-id="c2" lang="en"></div>
        <div class="count-row">
          <p class="caption">0자</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="bottom">
    <a class="btn-primary" href="review.html" data-ui-role="button">다 썼어요 · 교정 보기</a>
  </footer>

</main>
</body>
</html>
