<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기록 시작 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  button { font: inherit; color: #1C1B19; background: #FFFFFF; border: 1px solid #E6E2DA; cursor: pointer; }
  ul { list-style: none; }

  .caption { font-size: 13px; line-height: 1.5; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .title { font-size: 22px; font-weight: 700; line-height: 1.35; }
  .heading { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .body-muted { font-size: 16px; line-height: 1.6; color: #6B6760; }

  .top { display: flex; flex-direction: column; gap: 4px; padding: 24px 20px 8px; }

  /* 시트: 딤·그림자 없이 surface 면 + 윗선 + 윗모서리 16 으로 구분 (design.md 5.13) */
  .sheet { margin-top: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 32px; background: #FFFFFF; border-top: 1px solid #E6E2DA; border-radius: 16px 16px 0 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .close { display: flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 8px; font-size: 14px; font-weight: 600; line-height: 1.4; color: #1C1B19; }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .option { display: flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 16px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 12px; }
  .option-title { font-size: 16px; font-weight: 600; line-height: 1.4; }
</style>
</head>
<body>
<main data-screen="start-sheet" data-author="system" aria-label="기록 시작">

  <header class="top">
    <p class="caption">10월 2일 금요일</p>
    <p class="title">오늘 기록하기</p>
  </header>

  <section class="sheet" role="dialog" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h1 class="heading" id="sheet-title">어떤 기록으로 시작할까요?</h1>
      <a class="close" href="home.html" data-ui-role="button" aria-label="닫기">닫기</a>
    </div>
    <p class="body-muted">고른 기록은 영어로 표현해 볼 소재가 돼요. 글은 직접 써요.</p>

    <ul class="options">
      <li>
        <a class="option" href="write.html" data-ui-role="button">
          <span class="option-title">사진</span>
          <span class="body-muted">오늘 찍은 사진이나 갤러리 사진을 골라요</span>
        </a>
      </li>
      <li>
        <a class="option" href="capture-confirm.html" data-ui-role="button">
          <span class="option-title">대화 캡처</span>
          <span class="body-muted">메신저 대화 캡처를 읽어서 말풍선으로 보여줘요</span>
        </a>
      </li>
      <li>
        <a class="option" href="capture-confirm.html" data-ui-role="button">
          <span class="option-title">손글씨</span>
          <span class="body-muted">종이에 쓴 메모나 일기를 찍어서 글자를 읽어요</span>
        </a>
      </li>
      <li>
        <a class="option" href="write.html" data-ui-role="button">
          <span class="option-title">바로 쓰기</span>
          <span class="body-muted">기록 없이 빈 칸에서 바로 써요</span>
        </a>
      </li>
    </ul>
  </section>

</main>
</body>
</html>
