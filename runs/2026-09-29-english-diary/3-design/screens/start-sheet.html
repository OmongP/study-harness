<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기록 시작 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  ul { list-style: none; }
  img { display: block; }

  .caption { font-size: 13px; line-height: 1.5; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .heading { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .body-muted { font-size: 16px; line-height: 1.6; color: #6B6760; }

  /* 시트: 딤 없이 paper 위에 surface 면 + line 테두리로 구분 (design.md §2, §5.14) */
  .sheet { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 24px; background: #FFFFFF; border-top: 1px solid #E6E2DA; border-radius: 16px 16px 0 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .close { display: flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 8px; color: #1C1B19; }

  /* 아이콘은 항상 텍스트 라벨과 쌍으로 (R9, design.md §5.13) */
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 16px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 12px; }
  .src-icon-box { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: 0 0 40px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 8px; }
  .src-icon { width: 24px; height: 24px; }
  .option-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .option-title { font-size: 16px; font-weight: 600; line-height: 1.6; }
</style>
</head>
<body>
<main data-screen="start-sheet" data-author="system" aria-label="기록 시작 선택">

  <!-- 업셀·프리미엄 배지·초대 배너·완성 일기 생성 선택지 없음 (R9 피할 것, PRD 7) -->
  <section class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h1 class="heading" id="sheet-title">무엇으로 시작할까요?</h1>
      <a class="close label" href="home.html" data-ui-role="button" aria-label="닫기">닫기</a>
    </div>

    <ul class="options">
      <li>
        <a class="option" href="write.html" data-ui-role="button">
          <span class="src-icon-box"><img class="src-icon" alt="" aria-hidden="true" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1B19' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'><rect x='3' y='5' width='18' height='14' rx='2'/><circle cx='9' cy='10' r='2'/><path d='M21 16l-5-5-8 8'/></svg>"></span>
          <span class="option-text">
            <span class="option-title">사진</span>
            <span class="body-muted">오늘 찍은 사진을 보며 써요</span>
          </span>
        </a>
      </li>
      <li>
        <a class="option" href="capture-confirm.html" data-ui-role="button">
          <span class="src-icon-box"><img class="src-icon" alt="" aria-hidden="true" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1B19' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'><path d='M4 5h16v11H10l-6 4z'/></svg>"></span>
          <span class="option-text">
            <span class="option-title">대화 캡처</span>
            <span class="body-muted">나눈 대화에서 내 말을 영어로 써요</span>
          </span>
        </a>
      </li>
      <li>
        <a class="option" href="capture-confirm.html" data-ui-role="button">
          <span class="src-icon-box"><img class="src-icon" alt="" aria-hidden="true" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1B19' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'><rect x='4' y='4' width='16' height='16' rx='2'/><path d='M8 9h8M8 12h8M8 15h5'/></svg>"></span>
          <span class="option-text">
            <span class="option-title">텍스트 스캔</span>
            <span class="body-muted">손글씨 메모를 읽어 와서 시작해요</span>
          </span>
        </a>
      </li>
      <li>
        <a class="option" href="write.html" data-ui-role="button">
          <span class="src-icon-box"><img class="src-icon" alt="" aria-hidden="true" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1B19' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'><path d='M4 20l1-4L16 5l3 3L8 19z'/><path d='M14 7l3 3'/></svg>"></span>
          <span class="option-text">
            <span class="option-title">바로 쓰기</span>
            <span class="body-muted">아무것도 고르지 않고 바로 써요</span>
          </span>
        </a>
      </li>
    </ul>
  </section>

</main>
</body>
</html>
