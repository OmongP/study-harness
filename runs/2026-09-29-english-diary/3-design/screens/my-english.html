<!doctype html>

<style>

  a { color: #1C1B19; text-decoration: none; }
  button { font: inherit; color: #1C1B19; background: #FFFFFF; border: 1px solid #E6E2DA; cursor: pointer; }
  ul { list-style: none; }

  .caption { font-size: 13px; line-height: 1.5; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 1.4; }

  .top { display: flex; flex-direction: column; gap: 4px; padding: 24px 20px 8px; }
  .content { display: flex; flex-direction: column; gap: 24px; padding: 16px 20px 24px; }

  .section { display: flex; flex-direction: column; gap: 12px; }

  .item.reuse { background: #E4EEEA; border: 1px solid #E4EEEA; }
  .item .more { color: #2F5D50; text-decoration: underline; text-underline-offset: 4px; }
  .suggest { color: #2F5D50; }

  .tabbar { position: sticky; bottom: 0; margin-top: auto; display: flex; gap: 8px; padding: 4px 20px 8px; background: #FFFFFF; border-top: 1px solid #E6E2DA; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; line-height: 1.4; color: #6B6760; }
