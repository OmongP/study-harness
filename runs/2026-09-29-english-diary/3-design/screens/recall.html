<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떠올리기 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  button { font: inherit; color: #1C1B19; background: #FFFFFF; border: 1px solid #E6E2DA; cursor: pointer; }
  img { display: block; }

  .caption { font-size: 13px; line-height: 1.5; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .title { font-size: 22px; font-weight: 700; line-height: 1.35; }
  .heading { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .body-muted { font-size: 16px; line-height: 1.6; color: #6B6760; }
  .diary { font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 1.75; color: #1C1B19; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .back { display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 8px; font-size: 16px; font-weight: 600; }
  .saved { padding: 8px; }

  .recall { display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 24px; }
  .head { display: flex; flex-direction: column; gap: 4px; }
  .photo { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; }

  .cue { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #E4EEEA; border-radius: 16px; }
  .cue .label { color: #2F5D50; }

  .input-wrap { display: flex; flex-direction: column; gap: 8px; }
  .input { min-height: 180px; padding: 16px; background: #FFFFFF; border: 1px solid #2F5D50; border-radius: 12px; outline: none; }

  .bottom { position: sticky; bottom: 0; margin-top: auto; padding: 12px 20px 20px; background: #FAF8F4; border-top: 1px solid #E6E2DA; }
  .btn-primary { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 20px; background: #2F5D50; color: #FFFFFF; border-radius: 12px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main data-screen="recall" data-author="system" aria-label="떠올리기">

  <header class="topbar">
    <a class="back" href="home.html" data-ui-role="button" aria-label="홈으로 돌아가기">‹ 홈</a>
    <p class="caption">10월 2일 금요일</p>
    <p class="caption saved" role="status" aria-live="polite">✓ 자동 저장됨</p>
  </header>

  <!-- 떠올려 쓰기 영역: 사진 + 한국어 단서 + 입력칸. 정답 영어·완성 문장 없음 (PRD 3 RECALL, 6.5) -->
  <section class="recall" data-area="recall" aria-label="영어로 떠올려 쓰기">
    <div class="head">
      <p class="caption">9월 28일의 기록에서</p>
      <h1 class="title">그날을 떠올려 봐요</h1>
    </div>

    <img class="photo" alt="9월 28일 기록에 올린 회식 사진" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 350 180'><rect width='350' height='180' fill='%233B2F2A'/><rect y='112' width='350' height='68' fill='%238A5A3C'/><circle cx='90' cy='86' r='26' fill='%23E0B48A'/><circle cx='175' cy='78' r='26' fill='%23D9A57A'/><circle cx='260' cy='86' r='26' fill='%23E6BC94'/><rect x='128' y='124' width='18' height='38' rx='4' fill='%23F2C94C'/><rect x='204' y='124' width='18' height='38' rx='4' fill='%23F2C94C'/></svg>">

    <div class="cue" data-ui-role="card">
      <p class="label">떠올려 볼 단서</p>
      <p class="heading" data-author="ai" data-content-role="cue">이날 저녁, 회사 사람들과 한자리에 모여 다가올 팀 여행 이야기를 나눴어요.</p>
      <p data-author="ai" data-content-role="question" lang="en">What happened that evening, and who was there?</p>
      <p class="body-muted" data-author="ai" data-content-role="question">그날 저녁 무슨 일이 있었고, 누구와 함께였나요?</p>
    </div>

    <div class="input-wrap">
      <p class="label" id="recall-label">내 영어로 떠올려 쓰기</p>
      <div class="diary input" role="textbox" contenteditable="true" aria-multiline="true" aria-labelledby="recall-label" data-interactive="true" data-author="user" data-original-id="r1" lang="en">I had drinks with my coworkers. We talked about our team trip.</div>
      <p class="caption">기억나는 만큼만 써도 괜찮아요.</p>
    </div>
  </section>

  <footer class="bottom">
    <a class="btn-primary" href="recall-check.html" data-ui-role="button">다 썼어요 · 전에 쓴 표현 보기</a>
  </footer>

</main>
</body>
</html>
