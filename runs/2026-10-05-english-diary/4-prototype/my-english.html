<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My English — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  button, input { font: inherit; color: #1C1B19; background: transparent; border: 0; cursor: pointer; }
  ul, ol { list-style: none; }
  img { display: block; }

  .caption { font-size: 13px; font-weight: 400; line-height: 1.5; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .title { font-size: 24px; font-weight: 700; line-height: 1.75; color: #1C1B19; }
  .diary { font-family: Newsreader, Georgia, serif; font-size: 18px; font-weight: 400; line-height: 1.75; color: #1C1B19; }

  .top { display: flex; flex-direction: column; gap: 4px; padding: 24px 20px 8px; }
  .content { display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 24px; }

  .search { -webkit-appearance: none; appearance: none; width: 100%; min-height: 44px; padding: 8px 16px; font-size: 16px; line-height: 1.6; color: #1C1B19; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 12px; cursor: text; }
  .search::placeholder { color: #6B6760; }

  /* 분할 탭: 칩이 아님, ✓·개수 없음 (§5.17) */
  .segment { display: flex; width: 100%; gap: 4px; padding: 4px; background: #EFECE6; border-radius: 999px; }
  .seg { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 12px; border-radius: 999px; background: transparent; border: 1px solid #EFECE6; color: #6B6760; font-size: 14px; font-weight: 400; line-height: 1.4; }
  .seg[aria-pressed="true"] { background: #FFFFFF; border: 1px solid #E6E2DA; color: #1C1B19; font-weight: 700; }

  .sort-row { display: flex; justify-content: flex-end; }
  .btn-text { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 8px 0; background: transparent; color: #6B6760; font-size: 14px; font-weight: 600; line-height: 1.4; }

  .groups { display: flex; flex-direction: column; gap: 20px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group-head { color: #6B6760; }
  .exprs { display: flex; flex-direction: column; gap: 8px; }
  .expr { display: flex; flex-direction: column; gap: 4px; min-height: 44px; padding: 12px 16px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 16px; }
  .reused { border-bottom: 2px dotted #2F5D50; }

  .tabbar { position: sticky; bottom: 0; margin-top: auto; display: flex; gap: 8px; padding: 4px 20px 8px; background: #FFFFFF; border-top: 1px solid #E6E2DA; border-radius: 0; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; font-weight: 400; line-height: 1.4; color: #6B6760; }
  .tab[aria-current="page"] { color: #2F5D50; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<main data-screen="my-english" data-author="system" aria-label="My English">

  <header class="top">
    <h1 class="title">My English</h1>
  </header>

  <!-- 진행률·퍼센트·랭킹·숙련도·남은 개수 없음 (PRD 6.4) -->
  <div class="content">

    <input class="search" type="search" aria-label="표현 검색" placeholder="표현 검색">

    <div class="segment" role="group" aria-label="표현 구분">
      <button class="seg" type="button" aria-pressed="true" data-ui-role="button">저장한 표현</button>
      <button class="seg" type="button" aria-pressed="false" data-ui-role="button">스스로 다시 쓴 표현</button>
    </div>

    <div class="sort-row">
      <button class="sort btn-text" type="button" data-ui-role="button" aria-label="정렬: 최신순"><span>최신순</span><img class="icon" alt="" aria-hidden="true" width="16" height="16" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%236B6760' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>"></button>
    </div>

    <div class="groups">
      <section class="group" aria-labelledby="g-0928">
        <h2 class="label group-head" id="g-0928">9월 28일 월요일</h2>
        <ul class="exprs">
          <li>
            <a class="expr" href="expression-journey.html" data-ui-role="card" aria-label="had drinks with 표현 기록 보기">
              <p class="diary" data-author="ai" data-content-role="suggestion" lang="en">had drinks with</p>
              <p class="caption">교정 제안에서 저장 · 10월 2일 떠올려 씀</p>
            </a>
          </li>
          <li>
            <a class="expr" href="expression-journey.html" data-ui-role="card" aria-label="coworkers 표현 기록 보기">
              <p class="diary" data-author="ai" data-content-role="suggestion" lang="en">coworkers</p>
              <p class="caption">교정 제안에서 저장</p>
            </a>
          </li>
          <li>
            <a class="expr" href="expression-journey.html" data-ui-role="card" aria-label="team trip 표현 기록 보기">
              <p class="diary" data-author="user" lang="en">team trip</p>
              <p class="caption">내 글에서 저장</p>
            </a>
          </li>
        </ul>
      </section>

      <section class="group" aria-labelledby="g-0914">
        <h2 class="label group-head" id="g-0914">9월 14일 월요일</h2>
        <ul class="exprs">
          <li>
            <a class="expr" href="expression-journey.html" data-ui-role="card" aria-label="looking forward to 표현 기록 보기">
              <p class="diary" data-author="user" lang="en"><span class="reused">looking forward to</span></p>
              <p class="caption">점선 밑줄: 9월 28일 새 일기에서 스스로 다시 씀</p>
            </a>
          </li>
        </ul>
      </section>
    </div>

  </div>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a class="tab" href="home.html" data-ui-role="tab">홈</a>
    <a class="tab" href="my-english.html" aria-current="page" data-ui-role="tab">My English</a>
  </nav>

</main>
</body>
</html>
