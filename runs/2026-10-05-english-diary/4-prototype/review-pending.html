<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교정 준비 중 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  img { display: block; }

  .caption { font-size: 13px; font-weight: 400; line-height: 1.5; color: #6B6760; }
  .heading { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .body-muted { font-size: 16px; font-weight: 400; line-height: 1.6; color: #6B6760; }
  .puppy { object-fit: contain; flex: 0 0 auto; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .back { display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 8px; font-size: 16px; font-weight: 600; }
  .topbar .caption { padding: 8px; }

  /* 두 줄 대기 상태: 진행률 바·퍼센트·회전 표시·저장 경고 없음 (§5.19) */
  .pending { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; padding: 0 20px; text-align: center; }
  .status { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
  .link { display: flex; align-items: center; align-self: center; min-height: 44px; padding: 8px 0; font-size: 14px; font-weight: 600; line-height: 1.4; color: #2F5D50; text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<main data-screen="review-pending" data-author="system" aria-label="교정 준비 중">

  <header class="topbar">
    <a class="back" href="write.html" data-ui-role="button" aria-label="쓰기로 돌아가기">‹ 쓰기</a>
    <p class="caption">9월 28일 월요일</p>
  </header>

  <section class="pending" aria-label="교정 준비 상태">
    <img class="puppy" src="../../../docs/assets/puppy-walk.png" alt="" aria-hidden="true" width="120" height="120">
    <div class="status" role="status" aria-live="polite">
      <p class="heading">일기 저장 중</p>
      <p class="body-muted">교정을 준비하고 있어요</p>
    </div>
    <a class="link" href="review.html" data-ui-role="button">교정 보기로 넘어가기</a>
  </section>

</main>
</body>
</html>
