<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My English (빈 상태) — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; font-weight: 400; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  button, input { font: inherit; color: #1C1B19; background: transparent; border: 0; cursor: pointer; }
  img { display: block; }

  .title { font-size: 24px; font-weight: 700; line-height: 42px; color: #1C1B19; }
  .body { font-size: 16px; font-weight: 400; line-height: 1.6; color: #1C1B19; }
  .puppy { object-fit: contain; flex-shrink: 0; }

  .top { display: flex; flex-direction: column; padding: 24px 20px 8px; }
  .content { display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 24px; }
  .controls { display: flex; flex-direction: column; gap: 12px; }

  .search { -webkit-appearance: none; appearance: none; width: 100%; min-height: 44px; padding: 8px 16px; font-size: 16px; line-height: 26px; color: #1C1B19; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 12px; cursor: text; }
  .search::placeholder { color: #6B6760; }

  .segment { display: flex; width: 100%; gap: 4px; padding: 4px; background: #EFECE6; border-radius: 999px; }
  .seg { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 0; border-radius: 999px; background: transparent; border: 1px solid #EFECE6; color: #6B6760; font-size: 14px; font-weight: 400; line-height: 20px; }
  .seg[aria-pressed="true"] { background: #FFFFFF; border: 1px solid #E6E2DA; color: #1C1B19; font-weight: 700; }

  .sort-row { display: flex; justify-content: flex-end; min-height: 44px; }
  .btn-text { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px 0 8px; background: transparent; color: #6B6760; font-size: 14px; font-weight: 600; line-height: 20px; }

  /* 빈 상태: 한 문장만, 큰 0·독촉 없음 (§5.17) */
  .empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 16px; text-align: center; }

  .tabbar { position: sticky; bottom: 0; margin-top: auto; display: flex; gap: 8px; padding: 4px 20px 8px; background: #FFFFFF; border-top: 1px solid #E6E2DA; border-radius: 0; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; font-weight: 400; line-height: 20px; color: #6B6760; }
  .tab[aria-current="page"] { color: #2F5D50; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<main data-screen="my-english-empty" data-author="system" aria-label="My English">

  <header class="top">
    <h1 class="title">My English</h1>
  </header>

  <div class="content">

    <div class="controls">
      <input class="search" type="search" aria-label="표현 검색" placeholder="표현 검색">

      <div class="segment" role="group" aria-label="표현 구분">
        <button class="seg" type="button" aria-pressed="true" data-ui-role="button">저장한 표현</button>
        <button class="seg" type="button" aria-pressed="false" data-ui-role="button">스스로 다시 쓴 표현</button>
      </div>

      <div class="sort-row">
        <button class="sort btn-text" type="button" data-ui-role="button" aria-label="정렬: 최신순"><span>최신순</span><img class="icon" alt="" aria-hidden="true" width="16" height="16" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%236B6760' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>"></button>
      </div>
    </div>

    <section class="empty" aria-label="저장한 표현 없음">
      <img class="puppy" src="../../../docs/assets/puppy-sit.png" alt="" aria-hidden="true" width="96" height="96">
      <p class="body">교정 보기에서 다시 써 보고 싶은 표현을 저장하면 여기에 모여요.</p>
    </section>

  </div>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a class="tab" href="home.html" data-ui-role="tab">홈</a>
    <a class="tab" href="my-english.html" aria-current="page" data-ui-role="tab">My English</a>
  </nav>

</main>
</body>
</html>
