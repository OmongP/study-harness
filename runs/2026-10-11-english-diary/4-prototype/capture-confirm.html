<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡처 확인 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  button, input { font: inherit; color: #1C1B19; background: transparent; border: 0; cursor: pointer; }
  ul, ol { list-style: none; }
  img { display: block; }

  .caption { font-size: 13px; font-weight: 400; line-height: 20px; color: #6B6760; }
  .label { font-size: 14px; font-weight: 600; line-height: 20px; color: #1C1B19; }
  .title { font-size: 24px; font-weight: 700; line-height: 42px; color: #1C1B19; }
  .section-title { font-size: 24px; font-weight: 700; line-height: 42px; color: #1C1B19; }
  .body-strong { font-size: 16px; font-weight: 600; line-height: 1.6; color: #1C1B19; }

  /* 상단 바 (§5.1) */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .back { display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 8px; font-size: 16px; font-weight: 600; line-height: 1.6; color: #1C1B19; }
  .topbar .box { padding: 8px; }

  .content { display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 24px; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .meta-row { display: flex; align-items: center; gap: 8px; }
  .source { display: inline-flex; align-items: center; padding: 4px 12px; font-size: 14px; font-weight: 600; line-height: 20px; color: #1C1B19; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 999px; }

  /* 대화 상대 카드 (§5.23) */
  .partner { display: flex; flex-direction: column; gap: 12px; padding: 20px; background: #FFFFFF; border: 1px solid #E6E2DA; border-radius: 16px; }
  .person-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  /* 읽어 온 말 (§5.23) */
  .read { display: flex; flex-direction: column; gap: 12px; }
  .msgs { display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-radius: 16px; }
  .msg-them { background: #FFFFFF; border: 1px solid #E6E2DA; }
  .msg-me { background: #E4EEEA; border: 0; }
  .msg-me .chip { align-self: flex-start; }

  /* Choice Chip (§5.3) */
  .chip { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; font-size: 14px; font-weight: 600; line-height: 20px; background: #EFECE6; color: #1C1B19; border: 1px solid #EFECE6; border-radius: 999px; }
  .chip[aria-pressed="true"] { background: #E4EEEA; color: #1C1B19; border: 1px solid #2F5D50; font-weight: 700; }

  /* 하단 고정 영역 — 테두리 없음 (§4) */
  .bottom { position: sticky; bottom: 0; margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 20px 20px; background: #FAF8F4; border-radius: 0; }
  .btn-primary { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; padding: 12px 24px; background: #2F5D50; color: #FFFFFF; border-radius: 999px; font-size: 16px; font-weight: 600; line-height: 1.6; }
  .btn-secondary { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 20px; background: #EFECE6; color: #1C1B19; border: 0; border-radius: 999px; font-size: 16px; font-weight: 600; line-height: 1.6; }
  .bottom .btn-secondary { display: flex; width: 100%; }
</style>
</head>
<body>
<main data-screen="capture-confirm" data-author="system" aria-label="읽어 온 내용 확인">

  <header class="topbar">
    <a class="back" href="start-sheet.html" data-ui-role="button" aria-label="시작 방법 고르기로 돌아가기">‹ 시작</a>
    <div class="box">
      <p class="caption">10월 2일 금요일</p>
    </div>
  </header>

  <!-- AI 번역·답 채우기 없음, 강아지 없음 (§5.23) -->
  <div class="content">

    <div class="head">
      <div class="meta-row">
        <span class="source">대화 캡처에서 시작</span>
        <p class="caption">나만 보기 · 비공개 기록</p>
      </div>
      <h1 class="title">읽어 온 내용을 확인해요</h1>
      <p>캡처에서 읽은 글자는 고치지 않고 그대로 보여 줘요.</p>
    </div>

    <section class="partner" aria-labelledby="partner-label">
      <p class="label" id="partner-label">대화 상대</p>
      <div class="person-row">
        <p class="body-strong" data-author="user">지수</p>
        <button class="btn-secondary" type="button" data-ui-role="button">다른 사람으로 바꾸기</button>
      </div>
    </section>

    <section class="read" aria-labelledby="read-title">
      <h2 class="section-title" id="read-title">읽어 온 말</h2>
      <p>영어로 쓸 내 말을 골라요.</p>
      <ul class="msgs">
        <li class="msg msg-them">
          <p class="caption" data-author="user">지수</p>
          <p data-author="user">이번 주 금요일에 시간 돼?</p>
        </li>
        <li class="msg msg-me">
          <p class="caption">나</p>
          <p data-author="user">응, 저녁에 괜찮아. 어디 가고 싶은 데 있어?</p>
          <button class="chip" type="button" aria-pressed="true" data-ui-role="button"><span aria-hidden="true">✓&nbsp;</span>영어로 쓸 말</button>
        </li>
        <li class="msg msg-them">
          <p class="caption" data-author="user">지수</p>
          <p data-author="user">새로 생긴 파스타집 가 보자!</p>
        </li>
        <li class="msg msg-me">
          <p class="caption">나</p>
          <p data-author="user">좋아ㅋㅋㅋ 일곱 시에 회사 앞에서 만나자.</p>
          <button class="chip" type="button" aria-pressed="false" data-ui-role="button">영어로 쓸 말</button>
        </li>
      </ul>
    </section>

  </div>

  <footer class="bottom">
    <a class="btn-primary" href="write-conversation.html" data-ui-role="button">이 내용으로 쓰기 시작</a>
    <a class="btn-secondary" href="write.html" data-ui-role="button">말풍선 없이 한 편으로 쓰기</a>
  </footer>

</main>
</body>
</html>
