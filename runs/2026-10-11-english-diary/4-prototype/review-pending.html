<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일기 저장 중 — 영어가 내 것이 되는 일기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1C1B19; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; }
  [data-screen] { width: 390px; height: 844px; overflow-y: auto; background: #FAF8F4; color: #1C1B19; display: flex; flex-direction: column; }
  a { color: #1C1B19; text-decoration: none; }
  img { display: block; }

  .title { font-size: 24px; font-weight: 700; line-height: 42px; color: #1C1B19; }
  .body-muted { font-size: 16px; font-weight: 400; line-height: 1.6; color: #6B6760; }
  .puppy { object-fit: contain; flex-shrink: 0; }

  /* Figma 33:3446 — 상단 바 없음. 진행률 바·퍼센트·회전 표시·저장 경고 없음 (§5.19) */
  .pending { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; padding: 0 20px; }
  .status { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .link { display: flex; align-items: center; align-self: center; min-height: 44px; padding: 8px 0; font-size: 14px; font-weight: 600; line-height: 20px; color: #2F5D50; text-decoration-line: underline; text-decoration-style: solid; text-decoration-color: #2F5D50; text-underline-offset: 4px; }
</style>
</head>
<body>
<main data-screen="review-pending" data-author="system" aria-label="일기 저장 중">

  <section class="pending" aria-label="교정 준비 상태">
    <img class="puppy" src="../../../docs/assets/puppy-walk.png" alt="" aria-hidden="true" width="120" height="120">
    <div class="status" role="status" aria-live="polite">
      <p class="title">일기 저장 중</p>
      <p class="body-muted">문장을 살펴보고 있어요</p>
    </div>
    <a class="link" href="review.html" data-ui-role="button">교정 보기로 넘어가기</a>
  </section>

</main>
</body>
</html>
